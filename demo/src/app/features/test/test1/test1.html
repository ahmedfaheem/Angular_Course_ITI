
<!-- data interpolation -->
<p>if you want to manuplate data in html ----> id is {{id()+1}}</p>

<p>if you want to manuplate data in html ----> name is {{name()+' Angular'}}</p>

<!-- Property binding -->
<input [value]="x">
<!-- <input [value]="x+50"> -->

<h1 [innerText]="name()"></h1> <!-- property binding -->

<input type="text" [value]="name()" [disabled]="flag">
<input type="text" [value]="name()" [disabled]="!flag">

<table border="2 solid red">
    <tr>
        <th>id</th>
        <th>name</th>
    </tr>
    <tr>
        <td [colSpan]="y">{{id()}}</td>
        <!-- attribute binding -->
        <td [attr.colspan]="y">{{id()}}</td> <!-- both are same but [attr.colspan] is more explicit to html and [colSpan] is more explicit to TypeScript of dom properties -->

    </tr>
</table>
