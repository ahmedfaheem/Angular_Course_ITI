<section class="filter-box">
  <p class="total-price">Total Orders Price: <strong>{{total()}}</strong></p>
  <label class="form-label" for="categoryFilter">Filter by Category</label>
  <select id="categoryFilter" class="form-select mb-2" [(ngModel)]="filterID" (change)="filterChanged()">
    <option value="0" selected>All Categories</option>
    @for (category of categories; track category.id) {
    <option [value]="category.id">
      {{ category.name }}
    </option>
    }
  </select>
</section>
