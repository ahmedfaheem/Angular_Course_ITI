
<p class="text-center">Total Orders Price is  {{total()}}</p>
<select class="form-select mb-3" [(ngModel)]="filterID" (change)="filterChanged()">
  <option value="0" selected>All Categories</option>
  @for (category of categories; track category.id) {
  <option [value]="category.id">
    {{ category.name }}
  </option>
  }
</select>
