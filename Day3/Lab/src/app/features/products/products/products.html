<div class="container my-4">
    <h1 class="text-center pb-4 pt-2">Products Catalog</h1>

        <app-prodfilter [total]="totalPrice" (onFilterChange)="filterID.set($event)"></app-prodfilter>

    <div class="row g-4">

        <!-- Product 1 -->
         @for (item of (products | productfilter:filterID()); track item.id) {
        <div class="col-md-4" >
            <div class="card h-100 product-card">
                <img [src]="item.imgUrl"
                     class="card-img-top" [alt]="item.name">
                <div class="card-body">
                    <h5 class="card-title">{{ item.name }}</h5>
                    <p class="card-text mb-1">Price: ${{ item.price }}</p>
                    <p class="card-text text-muted">Quantity: {{ item.quantity }}</p>
                </div>
                <div class="card-footer">
                    @if (item.quantity > 0) {
                    <button class="btn btn-primary w-100" (click)="totalPrice += item.price; item.quantity -= 1">Buy Now</button>
                    } @else {
                    <button class="btn btn-secondary w-100" disabled>
                        Out of Stock
                    </button>
                    }
                </div>
            </div>
        </div>

    }

    </div>
</div>
