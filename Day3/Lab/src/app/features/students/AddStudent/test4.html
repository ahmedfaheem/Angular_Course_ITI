<div class="add-student">
  <div class="card shadow-sm mb-4">
    <div class="card-header add-header">
      <h3 class="text-center m-0">
        @if(itemID() != -1) {Edit Student} @else {Add Student}
      </h3>
    </div>

    <div class="card-body">
      <form #studentForm="ngForm" (ngSubmit)="itemID() != -1 ? editStd() : addStd()">
        <div class="mb-3">
          <label for="studentName" class="form-label">Name</label>
          <input name="studentName" [(ngModel)]="stdsTemp.name" type="text" class="form-control" id="studentName"
            placeholder="Enter student name" required>
        </div>

        <div class="mb-3">
          <label for="studentAge" class="form-label">Age</label>
          <input name="studentAge" [(ngModel)]="stdsTemp.age" type="number" class="form-control" id="studentAge"
            placeholder="Enter age" required>
        </div>

        @if(itemID() != -1) {
        <button type="submit" class="btn btn-success px-4">
          Edit Student
        </button>
        } @else { 
        <button type="submit" class="btn btn-primary px-4">
          Add Student
        </button>
         }
      </form>
    </div>
  </div>
</div>
